<main class="main-content">

<header class="topbar">

<h1>⚙️ Settings</h1>

<p>দোকানের তথ্য ও সিস্টেম সেটিংস পরিচালনা করুন</p>

</header>
<!-- ==========================================
SHOP SETTINGS
========================================== -->

<section class="card">

    <h2>🏪 Shop Information</h2>

    <form id="settingsForm" class="product-form">

        <div class="form-grid">

            <div class="form-group">

                <label>🏪 Shop Name</label>

                <input
                    type="text"
                    id="shopName"
                    placeholder="Mahmud Telecom"
                    required>

            </div>

            <div class="form-group">

                <label>👤 Owner Name</label>

                <input
                    type="text"
                    id="ownerName"
                    placeholder="Owner Name">

            </div>

            <div class="form-group">

                <label>📞 Mobile Number</label>

                <input
                    type="tel"
                    id="shopMobile"
                    placeholder="01XXXXXXXXX">

            </div>

            <div class="form-group">

                <label>📧 Email</label>

                <input
                    type="email"
                    id="shopEmail"
                    placeholder="example@email.com">

            </div>

            <div class="form-group">

                <label>📍 Shop Address</label>

                <textarea
                    id="shopAddress"
                    rows="3"
                    placeholder="দোকানের সম্পূর্ণ ঠিকানা"></textarea>

            </div>

            <div class="form-group">

                <label>🧾 Invoice Footer</label>

                <textarea
                    id="invoiceFooter"
                    rows="3"
                    placeholder="ধন্যবাদ, আবার আসবেন।"></textarea>

            </div>

        </div>

        <div class="mt-20">

            <button
                type="submit"
                class="dashboard-btn">

                💾 Save Settings

            </button>

            <button
                type="reset"
                class="btn-secondary">

                🔄 Reset

            </button>

        </div>

    </form>

</section>
<!-- ==========================================
SECURITY SETTINGS
========================================== -->

<section class="card">

    <h2>🔒 Security</h2>

    <form id="passwordForm" class="product-form">

        <div class="form-grid">

            <div class="form-group">
                <label>Current Password</label>
                <input
                    type="password"
                    id="currentPassword"
                    placeholder="বর্তমান পাসওয়ার্ড">
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="নতুন পাসওয়ার্ড">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="পাসওয়ার্ড পুনরায় লিখুন">
            </div>

        </div>

        <button
            type="submit"
            class="dashboard-btn">

            🔒 Change Password

        </button>

    </form>

</section>

<!-- ==========================================
BACKUP & RESTORE
========================================== -->

<section class="card">

    <h2>💾 Backup & Restore</h2>

    <div class="mt-20">

        <button
            id="backupBtn"
            class="dashboard-btn">

            📥 Backup Data

        </button>

        <button
            id="restoreBtn"
            class="btn-secondary">

            📤 Restore Data
<input
    type="file"
    id="restoreFile"
    accept=".json"
    style="display:none;">
        </button>

        <button
            id="resetDataBtn"
            class="btn-delete">

            🗑️ Reset All Data

        </button>

    </div>

</section>

</main>

</div>

<script src="js/settings.js"></script>

</body>

</html>
