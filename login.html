<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Mahmud Telecom</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<section class="login-page">

    <div class="login-box">

        <div class="login-header">

            <img src="images/logo.png"
                 alt="Logo">

            <h2>মাহমুদ টেলিকম</h2>

            <p>Shop Management System V8</p>

        </div>

        <form id="loginForm">

            <div class="input-box">

                <i class="fa fa-user"></i>

                <input type="text"
                       id="username"
                       placeholder="ইউজারনেম"
                       required>

            </div>

            <div class="input-box">

                <i class="fa fa-lock"></i>

                <input type="password"
                       id="password"
                       placeholder="পাসওয়ার্ড"
                       required>

            </div>

            <button type="submit"
                    class="login-btn">

                <i class="fa fa-right-to-bracket"></i>

                লগইন করুন

            </button>

        </form>

        <p class="login-footer">

            © 2026 Mahmud Telecom

        </p>

    </div>

</section>

<script src="js/login.js"></script>

</body>
</html>
