<!DOCTYPE html>

<html lang="bn">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Mahmud Telecom</title>
<link href="css/style.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet"/>
<link rel="icon" type="image/png" href="images/logo.png"/>
</head>
<body><script src="js/core.js"></script>
<section class="login-page">
<div class="login-box">
<div class="login-header">
<img alt="Logo" src="images/logo.png"/>
<h2>মাহমুদ টেলিকম</h2>
<p>Shop Management System V8</p>
</div>
<form id="loginForm">
<div class="input-box">
<i class="fa fa-user"></i>
<input id="username" placeholder="ইউজারনেম" required="" type="text"/>
</div>
<div class="input-box">
<i class="fa fa-lock"></i>
<input id="password" placeholder="পাসওয়ার্ড" required="" type="password"/>
</div>
<button class="login-btn" type="submit">
<i class="fa fa-right-to-bracket"></i>

                লগইন করুন

            </button>
</form>
<p class="login-footer">

            © 2026 Mahmud Telecom

        </p>
</div>
</section>
<script src="js/login.js"></script>
<script src="js/report-tools.js"></script></body>
</html>
