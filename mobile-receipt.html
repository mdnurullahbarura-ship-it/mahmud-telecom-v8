<!DOCTYPE html>

<html lang="bn">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transaction Receipt | Mahmud Telecom</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,"Noto Sans Bengali",sans-serif;margin:0;padding:20px;background:#fff;color:#222}
.receipt{width:100%;max-width:360px;margin:auto}
.header{text-align:center;border-bottom:2px dashed #333;padding-bottom:12px;margin-bottom:15px}
.header h2{margin:0 0 5px;font-size:22px}
.header p{margin:3px 0;font-size:13px}
.title{text-align:center;font-size:18px;font-weight:bold;margin:15px 0}
.info{width:100%;border-collapse:collapse}
.info td{padding:7px 3px;font-size:14px;border-bottom:1px dotted #aaa;vertical-align:top}
.info td:first-child{font-weight:bold;width:42%}
.amount{font-size:22px;font-weight:bold;text-align:center;padding:15px;margin-top:15px;border:2px solid #222}
.footer{text-align:center;margin-top:20px;padding-top:12px;border-top:2px dashed #333;font-size:12px}
.print-btn{display:block;margin:20px auto 0;padding:10px 25px;border:none;background:#1565c0;color:#fff;border-radius:5px;cursor:pointer;font-size:15px}
.back-btn{display:block;margin:8px auto 0;padding:8px 20px;border:none;background:#666;color:#fff;border-radius:5px;cursor:pointer;font-size:13px}
@media print{body{padding:0}.print-btn,.back-btn{display:none!important}.receipt{max-width:360px}}
</style>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet"/><link href="css/report.css" rel="stylesheet"/><link rel="icon" type="image/png" href="./images/logo-web.png"/>
</head>
<body><script src="js/core.js"></script>
<div class="receipt" id="receiptPrintable">
<div class="header">
<img class="mt-report-logo" src="./images/logo-web.png" alt="Mahmud Telecom" crossorigin="anonymous"/>
<h2>📱 <span id="shopName">Mahmud Telecom</span></h2>
<p id="serviceSubtitle">Digital Services</p>
</div>
<div class="title">🧾 Transaction Receipt</div>
<table class="info">
<tbody id="details"></tbody>
</table>
<div class="amount" id="total">Total: ৳0</div>
<div class="footer">
<p>ধন্যবাদ আমাদের সেবা গ্রহণ করার জন্য।</p>
<p>Mahmud Telecom</p>
</div>
<button class="print-btn" onclick="window.print()">🖨️ Print Receipt</button>
<button class="back-btn" onclick="history.back()">↩️ Back</button><button class="mt-png-btn" onclick="MahmudReportTools.downloadPNG('#receiptPrintable','Mahmud_Telecom_receiptPrintable')" type="button">🖼️ PNG</button>
</div>
<script>
(function(){
  const key='mahmudMobileBankingTransactions';
  let data=[];
  try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){data=[]}
  const params=new URLSearchParams(location.search);
  const id=Number(params.get('id')||localStorage.getItem('mahmudLastMobileTransactionId'));
  const item=data.find(x=>Number(x.id)===id)||data[0];
  const details=document.getElementById('details');
  const total=document.getElementById('total');
  const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
  const esc=v=>String(v??'-').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  if(!item){details.innerHTML='<tr><td colspan="2" style="text-align:center;padding:20px">কোনো Transaction পাওয়া যায়নি।</td></tr>';return;}
  const raw=String(item.date||'');
  const parts=raw.split(',');
  const date=parts[0]||raw||'-';
  const time=parts.slice(1).join(',').trim()||'-';
  document.getElementById('serviceSubtitle').textContent=item.service||'Digital Services';
  const rows=[
    ['Date',date],
    ['Time',time],
    ['Customer',item.customer||'Walk-in Customer'],
    ['Mobile',item.mobile||'-'],
    ['Account / Method',item.account||'-'],
    ['Transaction Type',item.type||'-'],
    ['Service',item.service||'-'],
    ['Transaction ID',item.transactionId||'-'],
    ['Charge',money(item.charge)]
  ];
  if(item.note) rows.push(['Note',item.note]);
  details.innerHTML=rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('');
  total.textContent='Total '+(item.type==='Recharge'?'Recharge':'Transaction')+': '+money(item.amount);
})();
</script>
<script src="js/report-tools.js"></script></body>
</html>
